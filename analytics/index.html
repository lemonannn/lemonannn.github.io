<!DOCTYPE html>
<html>

<head>
    <title>Me When Aidan Hutchinson Gets a Sack: :o</title>
    <link rel="stylesheet" href="/styles/homepage_style.css">
</head>

<div id = "temp_text">

</div>

<div id="home_link"></div>

<div id="footer"></div>

<script>
fetch('/footer.html')
  .then(res => res.text())
  .then(html => {
    document.getElementById('footer').innerHTML = html;
  });
</script>

<script>
fetch('/home_link.html')
  .then(res => res.text())
  .then(html => {
    document.getElementById('home_link').innerHTML = html;
  });
</script>

<script>
fetch("/data/projects.json")
  .then(response => response.json())
  .then(projects => {
    const container = document.getElementById("temp_text");

    projects.forEach(project => {
      const projectHTML = `
        <div>
        <p>
          <a href="${project.link}">${project.name}</a><br>
          ${project.blurb}
        </p>
        <div>
      `;
    
      if (project.display) {

      container.innerHTML += projectHTML;

      }
    });
  })
  .catch(error => {
    console.error("Error loading JSON:", error);
  });
</script>

</html>
